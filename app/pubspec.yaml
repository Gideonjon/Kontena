name: kontena
description: Group-buy and trade escrow for importers in Nigeria and Ghana.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Generates launcher icons for Android and iOS from assets/icon.png: dart run flutter_launcher_icons

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FF5B14"
  adaptive_icon_foreground: "assets/icon_fg.png"
