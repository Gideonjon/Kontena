name = "kontena-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
PAYMENT_MODE = "sandbox"
FIREBASE_PROJECT_ID = "usekontena"          # change to your Firebase project id
SITE_URL = "https://usekontena.web.app"
APP_URL = "https://usekontena.web.app/app"          # landing page
DEPOSIT_PERCENT = "30"
PLATFORM_FEE_PERCENT = "1.5"                 # [YOUR FEE] buyer protection fee, booked as revenue when supplier accepts
SELLER_COMMISSION_PERCENT = "0"              # optional cut taken from the supplier balance at release
WITHDRAWAL_SPREAD_PERCENT = "1.5"            # FX spread on USDC -> NGN/GHS withdrawals
USD_NGN = "1500"                             # USD to NGN rate used for pricing. STATIC: update it often or wire a rate API
USD_GHS = "15"
PLATFORM_FOSSA_CUSTOMER_ID = "b841a7b9-8905-4408-982a-ecdc7fe26d36"        # FossaPay customer that owns the treasury Stellar wallet
PLATFORM_STELLAR_ADDRESS = "CCEPDPHWB3JRZAUQBS74QD7QYNKHRXGSHXLX5APNBN4AN24HTWRBZRPK"  
FOSSAPAY_WALLETS_ENABLED = "true"       # that wallet's G... address
OFFRAMP_PROVIDER = "yellowcard"              # yellowcard | manual
YELLOWCARD_BASE = "https://sandbox.api.yellowcard.io"

[[d1_databases]]
binding = "DB"
database_name = "kontena"
database_id = "73b931fe-1233-4fb8-8e8a-3c9124be6449"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kontena-media"

[triggers]
crons = ["*/15 * * * *"]   # deadline sweeper: auto-refunds orders that miss their ship-by date

# Secrets (set with: wrangler secret put NAME)
#   PAYSTACK_SECRET_KEY, FOSSAPAY_API_KEY, FOSSAPAY_WEBHOOK_SECRET,
#   YELLOWCARD_API_KEY, YELLOWCARD_SECRET, FCM_SERVICE_ACCOUNT_JSON (optional)

# Routes (uncomment after adding your domain to Cloudflare):
# routes = [
#   { pattern = "api.kontena.app/*", zone_name = "kontena.app" },
#   { pattern = "kontena.app/s/*",   zone_name = "kontena.app" },   # share links -> OG preview + redirect into the app
# ]
