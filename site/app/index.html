<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kontena: group-buy and trade escrow for importers in Nigeria and Ghana. Your money is released only after your goods are inspected.">
  <meta name="theme-color" content="#FF5B14">
  <meta property="og:title" content="Kontena · Import with peace of mind">
  <meta property="og:description" content="Pool money with other traders, pay into escrow, release it only when your goods check out.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kontena">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Kontena</title>
  <style>
    html,body{margin:0;height:100%;background:#F7F7F5}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F7F7F5;transition:opacity .3s}
    #boot img{width:64px;height:64px;border-radius:18px;animation:p 1.2s ease-in-out infinite}
    @keyframes p{50%{transform:scale(.9);opacity:.7}}
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt="Kontena"></div>
  <script>window.addEventListener('flutter-first-frame',function(){var b=document.getElementById('boot');if(b){b.style.opacity=0;setTimeout(function(){b.remove()},300)}});</script>
  <script>
  /* Passkeys (fingerprint / face) for Kontena. Called from Dart: lib/core/passkey_js_web.dart */
  window.kontenaPasskey = (function () {
    var b2u = function (buf) { var s = '', b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
    var u2b = function (s) { var t = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); var b = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i); return b; };
    var creds = function (l) { return (l || []).map(function (c) { return Object.assign({}, c, { id: u2b(c.id) }); }); };
    var base = function (c) { return { id: c.id, rawId: b2u(c.rawId), type: c.type, clientExtensionResults: c.getClientExtensionResults ? c.getClientExtensionResults() : {}, authenticatorAttachment: c.authenticatorAttachment || undefined }; };
    return {
      supported: function () { return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); },
      create: async function (json) {
        var o = JSON.parse(json);
        var pk = Object.assign({}, o, { challenge: u2b(o.challenge), user: Object.assign({}, o.user, { id: u2b(o.user.id) }), excludeCredentials: creds(o.excludeCredentials) });
        var c = await navigator.credentials.create({ publicKey: pk });
        var r = c.response, out = base(c);
        out.response = { clientDataJSON: b2u(r.clientDataJSON), attestationObject: b2u(r.attestationObject), transports: r.getTransports ? r.getTransports() : [] };
        return JSON.stringify(out);
      },
      get: async function (json) {
        var o = JSON.parse(json);
        var pk = Object.assign({}, o, { challenge: u2b(o.challenge), allowCredentials: creds(o.allowCredentials) });
        var c = await navigator.credentials.get({ publicKey: pk });
        var r = c.response, out = base(c);
        out.response = { clientDataJSON: b2u(r.clientDataJSON), authenticatorData: b2u(r.authenticatorData), signature: b2u(r.signature), userHandle: r.userHandle ? b2u(r.userHandle) : undefined };
        return JSON.stringify(out);
      }
    };
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
